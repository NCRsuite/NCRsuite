name: Recover stuck GitHub Pages deployment

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-pages-lock.yml'

permissions:
  contents: read
  pages: write

jobs:
  cancel-stuck-pages-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STUCK_DEPLOYMENT: 1163b948e435075e914bcad110462bc58bfe36e4
        run: |
          set -euo pipefail
          status="$(curl -sS -L -o /tmp/pages-cancel-response.txt -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/pages/deployments/${STUCK_DEPLOYMENT}/cancel")"

          echo "GitHub Pages cancel HTTP status: ${status}"

          if [ "${status}" = '204' ]; then
            echo 'Stuck GitHub Pages deployment cancelled successfully.'
            exit 0
          fi

          echo 'GitHub response:'
          cat /tmp/pages-cancel-response.txt || true
          exit 1
